<div class="login-page">
  <div class="login-card">
    <div class="logo-section">
      <div class="logo-icon">
        <span class="material-icons">admin_panel_settings</span>
      </div>
      <h1>SmartConstat</h1>
      <p class="subtitle">Dashboard Administration</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">
          <span class="material-icons">email</span>
          Adresse email
        </label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="admin@smartconstat.tn"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label for="password">
          <span class="material-icons">lock</span>
          Mot de passe
        </label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <div class="error-msg" *ngIf="errorMessage">
        <span class="material-icons">error_outline</span>
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading">
        <span class="material-icons" *ngIf="!isLoading">login</span>
        <div class="spinner-small" *ngIf="isLoading"></div>
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>
    </form>
  </div>
</div>
