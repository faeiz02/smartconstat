# ─── Server ───
server.port=8082

# ─── MySQL Database ───
spring.datasource.url=jdbc:mysql://localhost:3306/smartconstat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── SQL Init ───
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ─── JWT ───
jwt.secret=SmartConstatSecretKey2024SecureJWT256bitsMinimum!!
jwt.expiration=86400000

# ─── Email / SMTP (Gmail) ───
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=votre.email@gmail.com
spring.mail.password=votre_mot_de_passe_application
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ─── App Config ───
app.backend.url=http://localhost:8082